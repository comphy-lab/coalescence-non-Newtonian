[project]
name = "coalescence-non-newtonian"
version = "0.0.1"
description = "Sharp-interface ALE finite-element simulations of drop coalescence in Newtonian and non-Newtonian media (pyoomph)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "CoMPhy Lab, Durham University" }]
dependencies = [
    "pyoomph",
]

[tool.uv]
package = false

[tool.uv.sources]
pyoomph = { git = "https://github.com/comphy-lab/pyoomph", rev = "f912ac10cdbb170e58aca3a337f0aa4ed13cf1e0" }

[dependency-groups]
pyoomph-build = [
    "nanobind==2.9.2",
    "scikit-build-core==0.11.6",
]
